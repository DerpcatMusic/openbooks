name: CI
on:
  push:
  pull_request:
env:
  PUPPETEER_SKIP_DOWNLOAD: "1"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: cd apps/web && bunx vp build # server tests serve the built app
      - run: bun run test
