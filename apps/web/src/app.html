<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenBooks</title>
    <!-- Installable (Chrome/Edge/Helium: Install app). No service worker on purpose: the window always loads the build the server has now. -->
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
    <meta name="theme-color" content="#5266eb" />
    <!-- Before first paint: theme, font, language/direction and privacy, so nothing flashes (stores take over after load). -->
    <script>
      try {
        const d = document.documentElement,
          s = localStorage;
        const t = s.getItem("ob-theme");
        if (t === "light" || t === "dark") d.dataset.theme = t;
        const f = s.getItem("ob-font");
        if (f) d.style.setProperty("--app-font", JSON.stringify(f));
        const l = s.getItem("ob-lang") || (navigator.language.toLowerCase().startsWith("he") ? "he" : "en");
        d.lang = l;
        d.dir = l === "he" ? "rtl" : "ltr";
        if (s.getItem("ob-private") === "1") d.setAttribute("data-private", "");
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Inter:wght@300..700&family=Instrument+Sans:wght@400..700&family=Figtree:wght@300..700&family=Noto+Sans+Hebrew:wght@400..700&display=swap"
      rel="stylesheet"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
